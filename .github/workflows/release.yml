name: Release Mods

on:
  release:
    types: [ published ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack mods
        id: pack
        shell: pwsh
        run: ./build/build.ps1

      - name: Upload ZIPs to release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          body_path: releases/${{ github.ref_name }}.md
